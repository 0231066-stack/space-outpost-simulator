<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Outpost Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="scene" id="scene"></div>

      <header class="topbar">
        <div>
          <p class="eyebrow">STEM Mission Challenge</p>
          <h1>Space Outpost Simulator</h1>
        </div>
        <div class="mission-picker">
          <button class="mission-btn active" data-mission="moon">Moon Base</button>
          <button class="mission-btn" data-mission="mars">Mars Outpost</button>
        </div>
      </header>

      <main class="game-layout">
        <section class="panel overview-panel">
          <div class="status-strip">
            <div>
              <span class="label">Mission</span>
              <strong id="missionName">Moon Base</strong>
            </div>
            <div>
              <span class="label">Day</span>
              <strong id="dayValue">1 / 14</strong>
            </div>
            <div>
              <span class="label">Crew</span>
              <strong id="crewValue">4</strong>
            </div>
            <div>
              <span class="label">Score</span>
              <strong id="scoreValue">0</strong>
            </div>
            <div>
              <span class="label">Status</span>
              <strong id="statusValue">Nominal</strong>
            </div>
          </div>

          <div class="resource-grid" id="resourceGrid"></div>

          <div class="systems-panel">
            <h2>Outpost Systems</h2>
            <div id="systemsList" class="systems-list"></div>
          </div>

          <div class="systems-panel">
            <h2>Crew</h2>
            <div id="crewList" class="systems-list"></div>
          </div>

          <div class="systems-panel">
            <h2>Objectives</h2>
            <div id="objectivesList" class="systems-list"></div>
          </div>
        </section>

        <section class="panel actions-panel">
          <h2>Mission Operations</h2>
          <p class="hint" id="actionHint">Spend the day on one upgrade. Systems produce resources daily, and crew specialists boost their area.</p>
          <div id="actionButtons" class="action-buttons"></div>
          <button id="advanceDayBtn" class="primary-btn" style="display:none">Restart Mission</button>
        </section>

        <section class="panel log-panel">
          <h2>Mission Log</h2>
          <div id="missionLog" class="mission-log"></div>
        </section>
      </main>
    </div>

    <script src="scene.js"></script>
    <script src="script.js"></script>
  </body>
</html>
