<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Outpost Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">STEM Mission Challenge</p>
          <h1>Space Outpost Simulator</h1>
        </div>
        <div class="topbar-right">
          <div class="mission-picker">
            <button class="mission-btn active" data-mission="moon">Moon Base</button>
            <button class="mission-btn" data-mission="mars">Mars Outpost</button>
          </div>
          <button id="restartBtn" class="primary-btn restart-btn" style="display:none">Restart Mission</button>
        </div>
      </header>

      <main class="game-layout">
        <section class="world-panel">
          <div class="world-frame">
            <canvas id="worldCanvas" width="416" height="176"></canvas>
          </div>
          <div class="world-bar">
            <div class="world-prompt" id="worldPrompt"><strong>WALK THE BASE</strong>Move with the arrow keys, then stand at a building and press <b>A</b> to spend the day.</div>
            <div class="world-controls">
              <div class="dpad">
                <button class="pad-btn pad-up" data-dir="up" aria-label="Move up">▲</button>
                <button class="pad-btn pad-left" data-dir="left" aria-label="Move left">◀</button>
                <button class="pad-btn pad-right" data-dir="right" aria-label="Move right">▶</button>
                <button class="pad-btn pad-down" data-dir="down" aria-label="Move down">▼</button>
              </div>
              <button class="pad-btn pad-a" data-act="action" aria-label="Act">A</button>
            </div>
          </div>
        </section>

        <section class="panel overview-panel">
          <div class="status-strip">
            <div>
              <span class="label">Mission</span>
              <strong id="missionName">Moon Base</strong>
            </div>
            <div>
              <span class="label">Day</span>
              <strong id="dayValue">1 / 14</strong>
            </div>
            <div>
              <span class="label">Crew</span>
              <strong id="crewValue">4</strong>
            </div>
            <div>
              <span class="label">Score</span>
              <strong id="scoreValue">0</strong>
            </div>
            <div>
              <span class="label">Status</span>
              <strong id="statusValue">Nominal</strong>
            </div>
          </div>

          <div class="resource-grid" id="resourceGrid"></div>

          <div class="systems-panel">
            <h2>Outpost Systems</h2>
            <div id="systemsList" class="systems-list"></div>
          </div>

          <div class="systems-panel">
            <h2>Crew</h2>
            <div id="crewList" class="systems-list"></div>
          </div>

          <div class="systems-panel">
            <h2>Objectives</h2>
            <div id="objectivesList" class="systems-list"></div>
          </div>
        </section>

        <section class="panel log-panel">
          <h2>Mission Log</h2>
          <div id="missionLog" class="mission-log"></div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
    <script src="scene.js"></script>
  </body>
</html>
